services:
  - type: web
    name: gym-app-backend
    runtime: node
    plan: free
    region: singapore
    # Creates/updates the TiDB tables and the admin account on each deploy.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma db push --skip-generate && npm run seed && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      # TiDB Cloud connection string. Must end with ?sslaccept=strict, e.g.
      # mysql://USER:PASS@gateway01.xxx.prod.aws.tidbcloud.com:4000/personal_gym_db?sslaccept=strict
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Account created by `npm run seed`
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin
      # Set to this service's own URL after the first deploy, e.g. https://gym-app-backend.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: MAX_VIDEO_UPLOAD_MB
        value: "100"
